<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spaceship Commander</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        sans: ['Inter','system-ui','sans-serif'],
        mono: ['"JetBrains Mono"','monospace'],
      },
      colors: {
        hull: '#0a0f1a',
        panel: '#111827',
        panel2: '#0d1526',
      }
    }
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{background:#0a0f1a;color:#e5e7eb;font-family:Inter,system-ui,sans-serif}
  .mono{font-family:"JetBrains Mono",monospace}
  .panel{background:linear-gradient(180deg,#111827 0%,#0d1526 100%);border:1px solid #1f2a3d;border-radius:12px}
  .sys-label{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#67e8f9;opacity:.8}
  .corner{position:relative}
  .corner::before,.corner::after{content:"";position:absolute;width:14px;height:14px;border-color:#22d3ee55;border-style:solid}
  .corner::before{top:-1px;left:-1px;border-width:1px 0 0 1px;border-radius:12px 0 0 0}
  .corner::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0;border-radius:0 0 12px 0}
  .btn-primary{background:#0e7490;color:#fff}.btn-primary:hover{background:#0891b2}
  .habit-done{border-color:#065f46!important;background:linear-gradient(180deg,#0b211c,#0d1526)!important}
  .task-done span.title{text-decoration:line-through;opacity:.5}
  .day-pill.on{background:#0e7490;color:#fff;border-color:#22d3ee}
  .area-pill.on{background:#0e7490;color:#fff;border-color:#22d3ee}
  .gear-menu{position:absolute;z-index:30;min-width:180px;background:#0f172a;border:1px solid #2a3a55;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.55);overflow:hidden}
  .gear-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 12px;font-size:13px;color:#e5e7eb}
  .gear-menu button:hover{background:#1e293b}
  .gear-menu button.danger{color:#fca5a5}
  .gear-menu button.danger:hover{background:#3b1212}
  input[type="date"],input[type="text"],select,textarea{color-scheme:dark}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#24344d;border-radius:8px}
</style>
</head>
<body class="min-h-screen">

<!-- HEADER -->
<header class="sticky top-0 z-30 border-b border-slate-800/80 bg-[#0a0f1a]/90 backdrop-blur">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
    <div class="w-9 h-9 rounded-lg bg-cyan-900/60 border border-cyan-700/50 grid place-items-center shrink-0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#67e8f9" stroke-width="1.6"><path d="M12 2 L15 9 L22 12 L15 15 L12 22 L9 15 L2 12 L9 9 Z"/></svg>
    </div>
    <div class="min-w-0 flex-1">
      <h1 class="font-bold tracking-tight leading-none truncate">Spaceship Commander</h1>
      <p class="mono text-[10px] tracking-[.2em] text-cyan-300/70 mt-1 hidden sm:block">STARDATE <span id="stardate">—</span> · SYS // PRODUCTIVITY</p>
    </div>
  </div>
</header>

<!-- COMMANDER VIEW -->
<main id="commander-view" class="max-w-6xl mx-auto px-4 pb-24 pt-5 space-y-5">

  <!-- 1+2) Dos columnas en ancho suficiente: hábitos izquierda, tareas derecha -->
  <div class="grid gap-5 lg:grid-cols-2 items-start">
  <!-- 1) MÓDULO HÁBITOS (izquierda en wide) -->
  <section class="panel corner p-4 sm:p-5">
    <div class="flex flex-wrap items-end gap-3 mb-3">
      <div>
        <div class="sys-label">01 // Rutinas de tripulación</div>
        <h2 class="text-xl font-bold mt-1">Mis hábitos <span id="todayLabel" class="text-slate-400 font-medium text-sm"></span></h2>
      </div>
      <div class="ml-auto flex items-center gap-3">
        <div class="text-right">
          <div id="todayProgressText" class="mono text-xs text-cyan-200">0/0</div>
          <div class="w-40 h-1.5 bg-slate-800 rounded-full mt-1 overflow-hidden"><div id="todayProgressBar" class="h-full bg-emerald-400 rounded-full transition-all" style="width:0%"></div></div>
        </div>
        <button id="btnNewHabit" class="btn-primary px-3 py-2 rounded-lg text-sm font-medium">+ Nuevo</button>
      </div>
    </div>
    <div class="flex flex-wrap gap-1.5 mb-3 text-xs">
      <button data-hfilter="hoy" class="hfilter px-2.5 py-1 rounded-md bg-cyan-800 text-white">Hoy</button>
      <button data-hfilter="free" class="hfilter px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Libres</button>
      <button data-hfilter="daily" class="hfilter px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Diarios</button>
      <button data-hfilter="weekly" class="hfilter px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Semanales</button>
      <button data-hfilter="all" class="hfilter px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Todos</button>
    </div>
    <div id="habitAreaRow" class="flex flex-wrap items-center gap-1.5 mb-3 text-xs" style="display:none">
      <span class="mono text-[10px] text-slate-500 mr-1">ÁREAS:</span>
      <button data-harea="__all" class="hafilter px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Todas</button>
      <button data-harea="Spirit" class="hafilter area-pill mono px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Spirit</button>
      <button data-harea="Social" class="hafilter area-pill mono px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Social</button>
      <button data-harea="Craft" class="hafilter area-pill mono px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Craft</button>
      <button data-harea="Health" class="hafilter area-pill mono px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Health</button>
    </div>
    <div id="allHabitsList"></div>
  </section>

  <!-- 2) Tareas (derecha en wide) -->
  <section class="panel p-4 sm:p-5">
      <div class="sys-label">02 // Operaciones</div>
      <div class="flex items-center gap-2 mt-1 mb-3">
        <h2 class="text-lg font-bold">Tareas</h2>
        <span id="taskCount" class="mono text-[11px] px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300"></span>
        <button id="btnNewTask" class="ml-auto btn-primary px-3 py-1.5 rounded-lg text-sm">+ Tarea</button>
      </div>
      <!-- quick add -->
      <div class="flex flex-wrap gap-2 mb-2">
        <input id="quickTaskTitle" type="text" placeholder="Añadir tarea rápida + Enter…" class="w-full sm:w-auto sm:flex-1 bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-cyan-600">
        <input id="quickTaskDate" type="date" class="flex-1 sm:flex-none min-w-0 bg-slate-900/80 border border-slate-700 rounded-lg px-2 py-2 text-sm outline-none focus:border-cyan-600 sm:w-[132px]">
        <button id="btnQuickAdd" class="shrink-0 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 hover:border-cyan-600 text-sm">Añadir</button>
      </div>
      <div class="flex gap-1.5 mb-3 text-xs">
        <button data-tfilter="all" class="tfilter px-2.5 py-1 rounded-md bg-cyan-800 text-white">Todas</button>
        <button data-tfilter="today" class="tfilter px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Hoy</button>
        <button data-tfilter="priority" class="tfilter px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">★ Prioridad</button>
        <button data-tfilter="done" class="tfilter px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Hechas</button>
      </div>
      <div class="flex flex-wrap items-center gap-1.5 mb-3 text-xs">
        <span class="mono text-[10px] text-slate-500 mr-1">ÁREAS:</span>
        <button data-tarea="__all" class="tafilter px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Todas</button>
        <button data-tarea="Spirit" class="tafilter area-pill mono px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Spirit</button>
        <button data-tarea="Social" class="tafilter area-pill mono px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Social</button>
        <button data-tarea="Craft" class="tafilter area-pill mono px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Craft</button>
        <button data-tarea="Health" class="tafilter area-pill mono px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300">Health</button>
      </div>
      <div id="taskList" class="space-y-2"></div>
  </section>
  </div>

  <p class="mono text-[10px] tracking-[.18em] text-slate-500 text-center pt-2">DATOS LOCALES // LOCALSTORAGE · SIN SERVIDOR</p>
</main>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 z-50 grid place-items-center p-4 bg-black/70 backdrop-blur-sm">
  <div class="panel w-full max-w-md p-5">
    <div class="sys-label" id="modalKicker">Nuevo</div>
    <h3 id="modalTitle" class="text-lg font-bold mt-1 mb-3">—</h3>
    <div class="space-y-3">
      <div>
        <label class="mono text-[11px] text-slate-400">TÍTULO</label>
        <input id="fTitle" type="text" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-cyan-600" placeholder="Ej. Revisar informe…">
      </div>
      <div id="rowTaskDate">
        <label class="mono text-[11px] text-slate-400">FECHA DE VENCIMIENTO (OPCIONAL)</label>
        <input id="fDate" type="date" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-cyan-600">
      </div>
      <div id="rowHabitType" class="hidden">
        <label class="mono text-[11px] text-slate-400">TIPO DE HÁBITO</label>
        <select id="fType" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none">
          <option value="free">Libre — sin frecuencia, múltiples veces/día</option>
          <option value="daily">Diario — cada jornada</option>
          <option value="weekly">Semanal — elige días</option>
        </select>
        <div id="dayPicker" class="hidden mt-2 grid grid-cols-7 gap-1">
          <button data-day="1" class="day-pill mono text-[11px] px-1 py-1.5 rounded-md bg-slate-800 border border-slate-700">Lun</button>
          <button data-day="2" class="day-pill mono text-[11px] px-1 py-1.5 rounded-md bg-slate-800 border border-slate-700">Mar</button>
          <button data-day="3" class="day-pill mono text-[11px] px-1 py-1.5 rounded-md bg-slate-800 border border-slate-700">Mié</button>
          <button data-day="4" class="day-pill mono text-[11px] px-1 py-1.5 rounded-md bg-slate-800 border border-slate-700">Jue</button>
          <button data-day="5" class="day-pill mono text-[11px] px-1 py-1.5 rounded-md bg-slate-800 border border-slate-700">Vie</button>
          <button data-day="6" class="day-pill mono text-[11px] px-1 py-1.5 rounded-md bg-slate-800 border border-slate-700">Sáb</button>
          <button data-day="0" class="day-pill mono text-[11px] px-1 py-1.5 rounded-md bg-slate-800 border border-slate-700">Dom</button>
        </div>
      </div>
      <label class="flex items-center gap-2 text-sm cursor-pointer select-none">
        <input id="fPriority" type="checkbox" class="w-4 h-4 accent-amber-400">
        <span>★ Marcar como <b>Prioridad</b></span>
      </label>
      <div>
        <label class="mono text-[11px] text-slate-400">ÁREAS (OPCIONAL — UNA O VARIAS)</label>
        <div id="areaPicker" class="mt-2 flex flex-wrap gap-1.5">
          <button data-area="Spirit" class="area-pill mono text-[11px] px-2.5 py-1.5 rounded-md bg-slate-800 border border-slate-700">Spirit</button>
          <button data-area="Social" class="area-pill mono text-[11px] px-2.5 py-1.5 rounded-md bg-slate-800 border border-slate-700">Social</button>
          <button data-area="Craft" class="area-pill mono text-[11px] px-2.5 py-1.5 rounded-md bg-slate-800 border border-slate-700">Craft</button>
          <button data-area="Health" class="area-pill mono text-[11px] px-2.5 py-1.5 rounded-md bg-slate-800 border border-slate-700">Health</button>
        </div>
      </div>
    </div>
    <div class="flex gap-2 mt-5">
      <button id="modalCancel" class="flex-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm">Cancelar</button>
      <button id="modalSave" class="flex-1 px-3 py-2 rounded-lg bg-cyan-700 hover:bg-cyan-600 text-white text-sm font-medium">Guardar</button>
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] hidden px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm text-center max-w-[calc(100vw-32px)]"></div>

<script>

/* ---------- utils + storage ---------- */
const KEY = 'spaceship-commander:v1';
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const todayStr = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate = (s) => { if(!s) return ''; const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString('es-ES',{day:'numeric',month:'short'}); };
const etaDays = (due) => { const [y,m,dd]=due.split('-').map(Number); const a=new Date(y,m-1,dd); const n=new Date(); n.setHours(0,0,0,0); return Math.round((a-n)/864e5); };
const DOW = () => new Date().getDay();
const DOW_NAMES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const AREAS = ['Spirit','Social','Craft','Health'];
const AREA_COLORS = {Spirit:'border-violet-700 text-violet-300',Social:'border-pink-700 text-pink-300',Craft:'border-cyan-700 text-cyan-300',Health:'border-emerald-700 text-emerald-300'};

/* ---------- gamificación: recursos ---------- */
const RES = {
  mc:  {name:'Megacréditos', sym:'◉', chip:'border-amber-700 text-amber-300'},
  ecos:{name:'Ecos',         sym:'∿', chip:'border-violet-700 text-violet-300', area:'Spirit'},
  nexos:{name:'Nexos',       sym:'⋈', chip:'border-pink-700 text-pink-300', area:'Social'},
  ale: {name:'Aleaciones',   sym:'⚒', chip:'border-cyan-700 text-cyan-300', area:'Craft'},
  bio: {name:'Biomasa',      sym:'✚', chip:'border-emerald-700 text-emerald-300', area:'Health'}
};
const AREA_RES = {Spirit:'ecos',Social:'nexos',Craft:'ale',Health:'bio'};
function freshState(){ return {tasks:[],habits:[],wallet:{mc:0,ecos:0,nexos:0,ale:0,bio:0}}; }
function normWallet(w){ const d={mc:0,ecos:0,nexos:0,ale:0,bio:0}; if(w) for(const k of Object.keys(d)) if(Number.isFinite(+w[k])) d[k]=Math.max(0,Math.floor(+w[k])); return d; }
function load(){ try{ const raw=localStorage.getItem(KEY); if(!raw) return freshState(); const s=JSON.parse(raw); const st={tasks:s.tasks||[],habits:s.habits||[]}; [...st.tasks,...st.habits].forEach(x=>{ if(!Array.isArray(x.areas)) x.areas=[]; x.areas=[...new Set(x.areas.map(a=>a==='Family'?'Social':a==='Work'?'Craft':a).filter(a=>AREAS.includes(a)))]; }); st.wallet=normWallet(s.wallet); return st; }catch{ return freshState(); } }
let state = load();
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.remove('hidden'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.add('hidden'),1800); }

function areaBadges(areas,max=2){ areas=(areas||[]).filter(a=>AREAS.includes(a)); if(!areas.length) return ''; const shown=areas.slice(0,max).map(a=>`<span class="mono text-[10px] px-1.5 py-0.5 rounded border ${AREA_COLORS[a]}">${a}</span>`).join(''); return shown+(areas.length>max?`<span class="mono text-[10px] text-slate-500">+${areas.length-max}</span>`:''); }
const matchAreas=(x,set)=> set.size===0 || (x.areas||[]).some(a=>set.has(a));

/* ---------- economía ---------- */
const addW=(k,n)=>{ state.wallet[k]+=n; };
const subW=(k,n)=>{ state.wallet[k]=Math.max(0,state.wallet[k]-n); };
const pickAreaRes=(x)=> (!x.areas||!x.areas.length)?null:AREA_RES[x.areas[Math.floor(Math.random()*x.areas.length)]];
const gainText=(g)=> `+${g.mc} ◉${g.res?`  +1 ${RES[g.res].sym} ${RES[g.res].name}`:''}`;
function grantTask(x){
  const g={mc:x.priority?15:10,res:pickAreaRes(x)};
  addW('mc',g.mc); if(g.res) addW(g.res,1);
  x.grant=g; return g;
}
function revokeTask(x){
  if(!x.grant) return;
  subW('mc',x.grant.mc); if(x.grant.res) subW(x.grant.res,1);
  delete x.grant;
}
function checkHabit(h,k){
  const g={mc:h.priority?8:5,res:pickAreaRes(h)};
  addW('mc',g.mc); if(g.res) addW(g.res,1);
  h.g=h.g||{}; h.g[k]=g; return g;
}
function uncheckHabit(h,k){
  if(h.g?.[k]){ subW('mc',h.g[k].mc); if(h.g[k].res) subW(h.g[k].res,1); delete h.g[k]; }
}
function tapFree(h,k){
  const first=(h.log?.[k]||0)===0;
  const g={mc:2,res:null};
  addW('mc',g.mc);
  if(first){ g.res=pickAreaRes(h); if(g.res){ addW(g.res,1); h.g=h.g||{}; h.g[k]={res:g.res}; } }
  h.log=h.log||{}; h.log[k]=(h.log[k]||0)+1;
  return g;
}
function untapFree(h,k){
  h.log=h.log||{}; h.log[k]=Math.max(0,(h.log[k]||0)-1);
  subW('mc',2);
  if(h.log[k]===0&&h.g?.[k]?.res){ subW(h.g[k].res,1); delete h.g[k]; }
}

/* ---------- gear menu (un solo botón ⚙ por tarjeta/fila) ---------- */
const GEAR_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
function gearMenuHTML(isPri){
  return `<div data-act="menu" class="gear-menu hidden right-2 top-10">`
    + `<button data-m="pri">${isPri?'★ Quitar prioridad':'★ Marcar prioridad'}</button>`
    + `<button data-m="edit">✎ Editar</button>`
    + `<button data-m="del" class="danger">✕ Eliminar</button></div>`;
}
function wireGear(el,acts){
  const gear=el.querySelector('[data-act="gear"]'), menu=el.querySelector('[data-act="menu"]');
  if(!gear||!menu) return;
  gear.onclick=(e)=>{e.stopPropagation(); document.querySelectorAll('.gear-menu').forEach(m=>{if(m!==menu)m.classList.add('hidden');}); menu.classList.toggle('hidden');};
  menu.onclick=(e)=>e.stopPropagation();
  menu.querySelector('[data-m="pri"]').onclick=()=>{menu.classList.add('hidden');acts.pri();};
  menu.querySelector('[data-m="edit"]').onclick=()=>{menu.classList.add('hidden');acts.edit();};
  menu.querySelector('[data-m="del"]').onclick=()=>{menu.classList.add('hidden');acts.del();};
}

let tFilter='all', hFilter='hoy';
let aFilterTasks=new Set(), aFilterHabits=new Set();
let modalMode=null, editingId=null, pickedDays=new Set(), pickedAreas=new Set();

/* ---------- habit helpers ---------- */
const countToday = (h) => h.log?.[todayStr()]||0;
function isScheduledToday(h){ if(h.type==='free') return true; if(h.type==='daily') return true; return (h.days||[]).includes(DOW()); }
function isDoneToday(h){ return countToday(h)>=1; }
function streak(h){
  let s=0; const d=new Date();
  for(let i=0;i<60;i++){
    const k=todayStr(d);
    if(h.type==='weekly' && !(h.days||[]).includes(d.getDay())){ d.setDate(d.getDate()-1); continue; }
    if((h.log?.[k]||0)>=1) s++; else break;
    d.setDate(d.getDate()-1);
  }
  return s;
}
function toggleHabitToday(h){
  const k=todayStr(); h.log=h.log||{};
  if(h.type==='free'){ const g=tapFree(h,k); save(); render(); toast(gainText(g)); return; }
  if((h.log[k]||0)>=1){ uncheckHabit(h,k); h.log[k]=0; }
  else { h.log[k]=1; const g=checkHabit(h,k); save(); render(); toast(gainText(g)); return; }
  save(); render();
}

/* ---------- render ---------- */
function render(){
  const dow=DOW(), t=todayStr();
  document.getElementById('stardate').textContent = new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
  document.getElementById('todayLabel').textContent = '· '+new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});

  // --- 1) Módulo hábitos único (Hoy por defecto) ---
  const todays = state.habits.filter(isScheduledToday).sort((a,b)=>(b.priority-a.priority)||a.title.localeCompare(b.title,'es'));
  const done = todays.filter(isDoneToday).length;
  document.getElementById('todayProgressText').textContent = `${done}/${todays.length} hoy`;
  document.getElementById('todayProgressBar').style.width = todays.length? (done/todays.length*100)+'%' : '0%';
  const box=document.getElementById('allHabitsList'); box.innerHTML='';
  const isHoy = (hFilter==='hoy');
  document.getElementById('habitAreaRow').style.display = isHoy ? 'none' : 'flex';
  paintAreaFilters();
  box.className = isHoy ? 'grid sm:grid-cols-2 gap-3' : 'space-y-2';
  if (isHoy && todays.length===0) box.innerHTML='<div class="text-sm text-slate-400 border border-dashed border-slate-700 rounded-lg p-4 text-center col-span-full">Sin hábitos para hoy. Crea un diario, un semanal para hoy, o un libre.</div>';
  todays.forEach(h=>{
    if(!isHoy) return;
    const c=countToday(h), d=isDoneToday(h);
    const card=document.createElement('div');
    card.className='relative rounded-xl border p-3 '+(d?'habit-done border-emerald-800':h.priority?'border-amber-500/70 bg-amber-950/25':'border-slate-700 bg-slate-900/70');
    card.innerHTML=`
      <div class="flex items-center gap-1.5">
        <span class="mono text-[10px] px-1.5 py-0.5 rounded border ${h.type==='free'?'border-slate-600 text-slate-300':h.type==='daily'?'border-cyan-800 text-cyan-300':'border-violet-800 text-violet-300'}">${h.type==='free'?'LIBRE':h.type==='daily'?'DIARIO':'SEMANAL'}</span>
        ${streak(h)>=2?`<span class="mono text-[10px] text-emerald-300">🔥 ${streak(h)}</span>`:''}
        <button data-act="gear" class="ml-auto text-slate-400 hover:text-cyan-300 p-1 leading-none" title="Opciones">${GEAR_SVG}</button>
      </div>
      ${gearMenuHTML(h.priority)}
      <div class="font-semibold mt-1.5 leading-snug">${escapeHtml(h.title)} ${h.priority?'<span class="mono text-[10px] text-amber-300 font-normal">★</span>':''}</div>
      ${areaBadges(h.areas)?`<div class="flex flex-wrap gap-1 mt-1.5">${areaBadges(h.areas)}</div>`:''}
      <div class="mono text-[11px] text-slate-400 mt-1">${h.type==='free'?`hoy: ${c} ${c===1?'vez':'veces'}`:h.type==='weekly'?('toca: '+DOW_NAMES[dow]):'toca hoy'}</div>
      <div class="flex gap-2 mt-2.5"></div>`;
    wireGear(card,{
      pri:()=>{h.priority=!h.priority;save();render();},
      edit:()=>openModal('habit',h.id),
      del:()=>{state.habits=state.habits.filter(y=>y.id!==h.id);save();render();toast('Hábito eliminado');}
    });
    const row=card.lastElementChild;
    if(h.type==='free'){
      row.innerHTML=`<button class="flex-1 px-2 py-2 rounded-lg bg-cyan-800 hover:bg-cyan-700 text-sm font-semibold">+ Registrar (${c})</button>
        ${c>0?'<button class="px-2 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm" title="Quitar uno">−1</button>':''}`;
      row.children[0].onclick=()=>{const g=tapFree(h,t); save(); render(); toast(gainText(g));};
      if(c>0) row.children[1].onclick=()=>{untapFree(h,t); save(); render();};
    } else {
      const b=document.createElement('button');
      b.className='flex-1 px-2 py-2 rounded-lg text-sm font-semibold '+(d?'bg-emerald-700 text-white':'bg-slate-800 border border-slate-600 hover:border-emerald-500');
      b.textContent=d?'✓ Completado — desmarcar':'Marcar completado';
      b.onclick=()=>toggleHabitToday(h); row.appendChild(b);
    }
    box.appendChild(card);
  });

  // --- 2) Tareas ---
  let tasks=[...state.tasks];
  if(tFilter==='today') tasks=tasks.filter(x=>x.dueDate===t);
  if(tFilter==='priority') tasks=tasks.filter(x=>x.priority && !x.done);
  if(tFilter==='done') tasks=tasks.filter(x=>x.done);
  if(aFilterTasks.size>0) tasks=tasks.filter(x=>matchAreas(x,aFilterTasks));
  tasks.sort((a,b)=>(a.done-b.done)||(b.priority-a.priority)||((a.dueDate||'9999')<(b.dueDate||'9999')?-1:1));
  const open=state.tasks.filter(x=>!x.done).length;
  document.getElementById('taskCount').textContent=open+' abiertas';
  const tl=document.getElementById('taskList'); tl.innerHTML='';
  if(!tasks.length) tl.innerHTML='<div class="text-sm text-slate-500 border border-dashed border-slate-700 rounded-lg p-3 text-center">Sin tareas aquí.</div>';
  tasks.forEach(x=>{
    const over=x.dueDate && x.dueDate<t && !x.done;
    const eta=x.dueDate?etaDays(x.dueDate):null;
    const el=document.createElement('div');
    el.className='relative flex items-center gap-2.5 rounded-xl border px-3 py-2.5 '+(x.done?'task-done border-slate-700 bg-slate-900/70':x.priority?'border-amber-500/70 bg-amber-950/25':'border-slate-700 bg-slate-900/70');
    el.innerHTML=`
      <button data-act="done" class="w-5 h-5 rounded-md border ${x.done?'bg-emerald-600 border-emerald-600 text-white':'border-slate-500'} grid place-items-center text-xs shrink-0" title="Completar">${x.done?'✓':''}</button>
      <div data-act="body" class="min-w-0 flex-1">
        <span class="title text-sm font-medium block truncate">${x.priority?'<span class="text-amber-300">★ </span>':''}${escapeHtml(x.title)}${(!x.done&&x.priority)?' <span class="mono text-[10px] font-normal text-amber-300/80">PRIORIDAD</span>':''}</span>
        <span class="mono text-[10px] ${over?'text-red-400':x.dueDate===t?'text-cyan-300':'text-slate-500'}">${x.dueDate?('◷ '+fmtDate(x.dueDate)+(over?' · ATRASADA':x.dueDate===t?' · HOY':'')):'sin fecha'}</span>${(eta!==null&&x.dueDate!==t)?` <span class="mono text-[10px] px-1.5 py-px rounded border ${over?'border-red-800 text-red-300':'border-slate-600 text-slate-300'}">${over?('hace '+(-eta)+(-eta===1?' día':' días')):('ETA '+eta+(eta===1?' día':' días'))}</span>`:''}
        ${areaBadges(x.areas)?`<span class="flex flex-wrap gap-1 mt-1">${areaBadges(x.areas)}</span>`:''}
      </div>
      <button data-act="gear" class="text-slate-400 hover:text-cyan-300 p-1 shrink-0 leading-none" title="Opciones">${GEAR_SVG}</button>
      ${gearMenuHTML(x.priority)}`;
    el.querySelector('[data-act="done"]').onclick=()=>{
      if(!x.done){ x.done=true; const g=grantTask(x); save(); render(); toast(gainText(g)); }
      else { x.done=false; revokeTask(x); save(); render(); }
    };
    wireGear(el,{
      pri:()=>{x.priority=!x.priority;save();render();},
      edit:()=>openModal('task',x.id),
      del:()=>{state.tasks=state.tasks.filter(y=>y.id!==x.id);save();render();toast('Tarea eliminada');}
    });
    el.querySelector('[data-act="body"]').ondblclick=()=>openModal('task',x.id);
    tl.appendChild(el);
  });

  // --- 3) Gestión (Libres / Diarios / Semanales / Todos) ---
  if(!isHoy){
  let hs=[...state.habits];
  if(hFilter!=='all') hs=hs.filter(h=>h.type===hFilter);
  if(aFilterHabits.size>0) hs=hs.filter(h=>matchAreas(h,aFilterHabits));
  hs.sort((a,b)=>(b.priority-a.priority)||a.title.localeCompare(b.title,'es'));
  const al=document.getElementById('allHabitsList'); al.innerHTML='';
  if(!hs.length) al.innerHTML='<div class="text-sm text-slate-500 border border-dashed border-slate-700 rounded-lg p-3 text-center">Sin hábitos. Crea el primero.</div>';
  hs.forEach(h=>{
    const c=countToday(h), sched=isScheduledToday(h);
    const el=document.createElement('div');
    el.className='relative rounded-xl border px-3 py-2.5 '+(h.priority?'border-amber-500/70 bg-amber-950/25':'border-slate-700 bg-slate-900/70');
    el.innerHTML=`
      <div class="flex items-center gap-2">
        <span class="mono text-[10px] px-1.5 py-0.5 rounded border border-slate-600 text-slate-300">${h.type.toUpperCase()}</span>
        ${h.type==='weekly'?`<span class="mono text-[10px] text-slate-400">${(h.days||[]).map(d=>DOW_NAMES[d]).join(' ')}</span>`:''}
        ${!sched?'<span class="mono text-[10px] text-slate-500">· stand-by hoy</span>':''}
        <button data-act="gear" class="ml-auto text-slate-400 hover:text-cyan-300 p-1 leading-none" title="Opciones">${GEAR_SVG}</button>
      </div>
      ${gearMenuHTML(h.priority)}
      <div class="text-sm font-medium mt-1">${h.priority?'<span class="text-amber-300">★ </span>':''}${escapeHtml(h.title)}${h.priority?' <span class="mono text-[10px] font-normal text-amber-300/80">PRIORIDAD</span>':''} <span class="mono text-[10px] text-slate-500">· hoy ${c} · racha ${streak(h)}</span>${areaBadges(h.areas)?` <span class="inline-flex flex-wrap gap-1 align-middle">${areaBadges(h.areas)}</span>`:''}</div>`;
    wireGear(el,{
      pri:()=>{h.priority=!h.priority;save();render();},
      edit:()=>openModal('habit',h.id),
      del:()=>{state.habits=state.habits.filter(y=>y.id!==h.id);save();render();toast('Hábito eliminado');}
    });
    al.appendChild(el);
  });
  }
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* ---------- modal ---------- */
function openModal(mode,id=null){
  modalMode=mode; editingId=id; pickedDays=new Set(); pickedAreas=new Set();
  const isEdit=!!id;
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modalKicker').textContent=(isEdit?'EDITAR // ':'NUEVO // ')+(mode==='task'?'TASK':'HABIT');
  document.getElementById('modalTitle').textContent=mode==='task'?(isEdit?'Editar tarea':'Nueva tarea'):(isEdit?'Editar hábito':'Nuevo hábito');
  document.getElementById('rowTaskDate').classList.toggle('hidden',mode!=='task');
  document.getElementById('rowHabitType').classList.toggle('hidden',mode!=='habit');
  const t=document.getElementById('fTitle'), d=document.getElementById('fDate'), p=document.getElementById('fPriority'), ty=document.getElementById('fType');
  t.value='';d.value='';p.checked=false;ty.value='free';syncDayPicker();syncAreaPicker();
  if(isEdit){
    if(mode==='task'){const x=state.tasks.find(y=>y.id===id); t.value=x.title; d.value=x.dueDate||''; p.checked=!!x.priority; pickedAreas=new Set(x.areas||[]); syncAreaPicker();}
    else{const h=state.habits.find(y=>y.id===id); t.value=h.title; p.checked=!!h.priority; ty.value=h.type; pickedDays=new Set(h.days||[]); syncDayPicker(); pickedAreas=new Set(h.areas||[]); syncAreaPicker();}
  }
  setTimeout(()=>t.focus(),30);
}
function syncDayPicker(){
  const show=document.getElementById('fType').value==='weekly';
  document.getElementById('dayPicker').classList.toggle('hidden',!show);
  document.querySelectorAll('.day-pill').forEach(b=>b.classList.toggle('on',pickedDays.has(Number(b.dataset.day))));
}
function syncAreaPicker(){
  document.querySelectorAll('#areaPicker .area-pill').forEach(b=>b.classList.toggle('on',pickedAreas.has(b.dataset.area)));
}
function paintAreaFilters(){
  document.querySelectorAll('.tafilter[data-tarea]').forEach(b=>{const a=b.dataset.tarea; if(a!=='__all') b.classList.toggle('on',aFilterTasks.has(a));});
  document.querySelectorAll('.hafilter[data-harea]').forEach(b=>{const a=b.dataset.harea; if(a!=='__all') b.classList.toggle('on',aFilterHabits.has(a));});
}
function closeModal(){document.getElementById('modal').classList.add('hidden');modalMode=null;editingId=null;}

document.getElementById('modalSave').onclick=()=>{
  const title=document.getElementById('fTitle').value.trim();
  if(!title){toast('Escribe un título');return;}
  if(modalMode==='task'){
    const due=document.getElementById('fDate').value||null, pri=document.getElementById('fPriority').checked, areas=[...pickedAreas];
    if(editingId){const x=state.tasks.find(y=>y.id===editingId); Object.assign(x,{title,dueDate:due,priority:pri,areas});}
    else state.tasks.push({id:uid(),title,dueDate:due,priority:pri,done:false,areas,createdAt:Date.now()});
  } else {
    const type=document.getElementById('fType').value, pri=document.getElementById('fPriority').checked, areas=[...pickedAreas];
    if(type==='weekly'&&pickedDays.size===0){toast('Elige al menos un día');return;}
    if(editingId){const h=state.habits.find(y=>y.id===editingId); Object.assign(h,{title,priority:pri,type,days:type==='weekly'?[...pickedDays].sort():null,areas});}
    else state.habits.push({id:uid(),title,type,days:type==='weekly'?[...pickedDays].sort():null,priority:pri,areas,log:{},createdAt:Date.now()});
  }
  save();closeModal();render();toast('Guardado ✓');
};
document.getElementById('modalCancel').onclick=closeModal;
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.gear-menu').forEach(m=>m.classList.add('hidden'));if(!document.getElementById('modal').classList.contains('hidden'))closeModal();}});
document.addEventListener('click',()=>document.querySelectorAll('.gear-menu').forEach(m=>m.classList.add('hidden')));
document.getElementById('fType').onchange=syncDayPicker;
document.querySelectorAll('.day-pill').forEach(b=>b.onclick=()=>{const d=Number(b.dataset.day);pickedDays.has(d)?pickedDays.delete(d):pickedDays.add(d);syncDayPicker();});
document.querySelectorAll('#areaPicker .area-pill').forEach(b=>b.onclick=()=>{const a=b.dataset.area;pickedAreas.has(a)?pickedAreas.delete(a):pickedAreas.add(a);syncAreaPicker();});

/* ---------- wiring ---------- */
document.getElementById('btnNewTask').onclick=()=>openModal('task');
document.getElementById('btnNewHabit').onclick=()=>openModal('habit');
const quickAdd=()=>{const i=document.getElementById('quickTaskTitle');const v=i.value.trim();if(!v)return;state.tasks.push({id:uid(),title:v,dueDate:document.getElementById('quickTaskDate').value||null,priority:false,done:false,areas:[],createdAt:Date.now()});i.value='';save();render();};
document.getElementById('btnQuickAdd').onclick=quickAdd;
document.getElementById('quickTaskTitle').addEventListener('keydown',e=>{if(e.key==='Enter')quickAdd();});
document.querySelectorAll('.tfilter').forEach(b=>b.onclick=()=>{tFilter=b.dataset.tfilter;document.querySelectorAll('.tfilter').forEach(x=>x.className='tfilter px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300');b.className='tfilter px-2.5 py-1 rounded-md bg-cyan-800 text-white';render();});
document.querySelectorAll('.hfilter').forEach(b=>b.onclick=()=>{hFilter=b.dataset.hfilter;document.querySelectorAll('.hfilter').forEach(x=>x.className='hfilter px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300');b.className='hfilter px-2.5 py-1 rounded-md bg-cyan-800 text-white';render();});
document.querySelectorAll('.tafilter').forEach(b=>b.onclick=()=>{const a=b.dataset.tarea; if(a==='__all') aFilterTasks.clear(); else aFilterTasks.has(a)?aFilterTasks.delete(a):aFilterTasks.add(a); render();});
document.querySelectorAll('.hafilter').forEach(b=>b.onclick=()=>{const a=b.dataset.harea; if(a==='__all') aFilterHabits.clear(); else aFilterHabits.has(a)?aFilterHabits.delete(a):aFilterHabits.add(a); render();});

/* ---------- boot ---------- */
render();
localStorage.removeItem('spaceship-commander:ui');
</script>
</body>
